<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>任務計時器 · Mission Timer</title>
<style>
  :root{
    --bg:      #070C16;
    --ink:     #FFFFFF;
    --muted:   #7C8B9E;
    --accent:  #2CB8F5;
    --accent-d:#1195DC;
    --on-accent:#FFFFFF;
    --line:    rgba(255,255,255,.11);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", Menlo,
            Consolas, "Noto Sans Mono", "Courier New", monospace;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  /* ---------- 星球切換頁籤 ---------- */
  .tabs{
    position:fixed;z-index:2;
    top:clamp(14px,3vh,28px);
    right:clamp(14px,3vw,42px);
    display:flex;gap:10px;
  }
  .tab{
    font-family:inherit;
    font-size:clamp(13px,1.5vw,16px);
    font-weight:600;
    letter-spacing:.06em;
    padding:12px 22px;
    border-radius:999px;
    cursor:pointer;
    color:#C2CEDC;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .12s ease;
  }
  .tab:hover:not([aria-selected="true"]){background:rgba(255,255,255,.10);color:#fff}
  .tab:active{transform:translateY(1px)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .tab[aria-selected="true"]{
    background:#EEF3F8;
    border-color:#EEF3F8;
    color:#101A2B;
    box-shadow:0 6px 22px rgba(200,225,255,.16);
  }

  /* ---------- 主體 ---------- */
  .hud{
    position:relative;z-index:1;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14vh 20px 22vh;
  }

  .clock{
    margin:0;
    font-size:clamp(3.4rem,12.5vw,8.4rem);
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    letter-spacing:.01em;
    text-shadow:0 0 70px rgba(120,200,255,.20);
    white-space:nowrap;
  }
  .clock .sep{margin:0 .16em;opacity:.9}
  body.is-done .clock{color:var(--accent)}

  /* ---------- 日出日落 ---------- */
  .sun{
    margin:clamp(14px,2.6vh,24px) 0 0;
    min-height:1.3em;                 /* 先佔位，資料回來時畫面不會跳動 */
    font-size:clamp(12px,1.6vw,15px);
    letter-spacing:.18em;
    text-indent:.18em;
    color:var(--muted);
    transition:color .3s ease,opacity .3s ease;
    opacity:0;
  }
  .sun.is-ready{opacity:1}
  .sun.is-offline{color:#5A6878;opacity:1}

  /* ---------- 進度條 + 火箭 ---------- */
  .track{
    --p:0;
    position:relative;
    width:min(560px,70vw);
    margin-top:clamp(22px,5.2vh,54px);
    height:24px;
  }
  .track-line{
    position:absolute;left:0;right:0;top:50%;
    height:3px;margin-top:-1.5px;
    background:rgba(255,255,255,.14);
    border-radius:999px;
  }
  .track-fill{
    position:absolute;left:0;top:50%;
    height:3px;margin-top:-1.5px;
    width:calc(var(--p) * 100%);
    background:var(--accent);
    border-radius:999px;
    box-shadow:0 0 14px rgba(44,184,245,.65);
  }
  .rocket{
    position:absolute;top:50%;
    left:calc(var(--p) * 100%);
    transform:translate(-50%,-50%);
    color:var(--accent);
    pointer-events:none;
    will-change:left;
    filter:drop-shadow(0 0 10px rgba(44,184,245,.5));
  }
  .rocket svg{display:block;overflow:visible}
  .rocket .stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .rocket .hull.stroke{fill:#0B1322}   /* 機身填底，進度線不會穿過火箭 */
  .rocket .exhaust{opacity:0;transition:opacity .25s ease}
  body.is-running .rocket .exhaust{opacity:1;animation:puff .5s ease-in-out infinite}
  body.is-running .rocket{animation:bob 2.4s ease-in-out infinite}
  @keyframes puff{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes bob{0%,100%{transform:translate(-50%,calc(-50% - .8px))}50%{transform:translate(-50%,calc(-50% + .8px))}}

  .track-labels{
    display:flex;justify-content:space-between;
    width:min(560px,70vw);
    margin-top:12px;
    font-size:clamp(12px,1.5vw,15px);
    letter-spacing:.14em;
    color:var(--muted);
  }

  /* ---------- 按鈕 ---------- */
  .controls{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    margin-top:clamp(38px,10vh,104px);
  }
  .btn{
    font-family:inherit;
    font-size:clamp(15px,1.9vw,20px);
    font-weight:700;
    letter-spacing:.16em;text-indent:.16em;
    padding:18px 40px;
    border-radius:22px;
    cursor:pointer;
    color:#C2CEDC;
    background:rgba(14,23,38,.66);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:background .18s ease,color .18s ease,border-color .18s ease,
               transform .12s ease,box-shadow .18s ease,opacity .18s ease;
  }
  .btn:hover:not(:disabled){background:rgba(30,45,68,.82);color:#fff;border-color:rgba(255,255,255,.26)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .btn-primary{
    color:var(--on-accent);
    background:linear-gradient(180deg,var(--accent),var(--accent-d));
    border-color:transparent;
    box-shadow:0 10px 30px rgba(44,184,245,.30);
  }
  .btn-primary:hover:not(:disabled){
    color:var(--on-accent);
    background:linear-gradient(180deg,#48C5F8,#1AA2E8);
    border-color:transparent;
    box-shadow:0 0 0 6px rgba(44,184,245,.14),0 10px 34px rgba(44,184,245,.38);
  }

  @media (max-width:640px){
    .tabs{
      left:0;right:0;justify-content:center;flex-wrap:wrap;
      padding:0 12px;gap:8px;
    }
    .tab{padding:9px 15px;font-size:13px}
    .hud{padding:20vh 16px 24vh}
    .btn{padding:15px 22px}
  }

  @media (prefers-reduced-motion:reduce){
    body.is-running .rocket,
    body.is-running .rocket .exhaust{animation:none}
    .btn,.tab{transition:none}
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>

<nav class="tabs" id="tabs" role="tablist" aria-label="選擇星球"></nav>

<main class="hud">
  <h1 class="clock" id="clock"><span id="mm">25</span><span class="sep">:</span><span id="ss">00</span></h1>

  <p class="sun" id="sun" aria-live="polite"></p>

  <div class="track" id="track">
    <div class="track-line"></div>
    <div class="track-fill"></div>
    <span class="rocket" id="rocket" aria-hidden="true">
      <svg viewBox="0 0 44 28" width="40" height="25">
        <g class="exhaust">
          <path class="stroke" d="M6.5 14 L0.5 14" stroke-width="1.8" opacity=".9"/>
          <path class="stroke" d="M8 10.4 L3.5 8.6" stroke-width="1.3" opacity=".45"/>
          <path class="stroke" d="M8 17.6 L3.5 19.4" stroke-width="1.3" opacity=".45"/>
        </g>
        <!-- 後掠尾翼（先畫，機身會蓋住翼根）-->
        <path class="hull stroke" d="M19 8.6 L12 8.6 L9.5 3.4 Z"/>
        <path class="hull stroke" d="M19 19.4 L12 19.4 L9.5 24.6 Z"/>
        <!-- 機身：圓尾、尖鼻朝右 -->
        <path class="hull stroke"
              d="M11 8.6 L26 8.6 C 32.5 8.6, 38 10.9, 41 14
                 C 38 17.1, 32.5 19.4, 26 19.4 L11 19.4
                 C 8 19.4, 8 8.6, 11 8.6 Z"/>
        <circle class="hull stroke" cx="27" cy="14" r="2.7" stroke-width="1.7"/>
      </svg>
    </span>
  </div>

  <div class="track-labels"><span>啟程</span><span>抵達</span></div>

  <div class="controls">
    <button type="button" class="btn btn-primary" id="btnLaunch">發射</button>
    <button type="button" class="btn" id="btnHold">待機</button>
    <button type="button" class="btn" id="btnReturn">返航</button>
  </div>

  <p class="sr-only" id="status" aria-live="polite">待命中</p>
</main>

<script>
(() => {
  'use strict';

  /* ============================================================
     1. 星空 — 座標載入時算一次就凍結，之後任何重繪（resize、換星球）
        都只是拿同一組數字乘上畫布尺寸，所以星星不會跳動
     ============================================================ */

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const STARS = (() => {
    const rnd = mulberry32(20260809);
    const out = [];
    for (let i = 0; i < 380; i++){
      const mag = Math.pow(rnd(), 2.6);            // 多數暗、少數亮
      out.push({
        x: rnd(),
        y: Math.pow(rnd(), 0.85) * 0.86,           // 偏上分布（下方被星球遮住）
        m: mag,
        s: 0.34 + mag * 1.05,
        h: rnd() < 0.16 ? 36 : 205                 // 少數偏暖，其餘冷白
      });
    }
    return Object.freeze(out);
  })();

  /* ============================================================
     2. 星球 — 經緯排列的粒子點陣，只露出畫面下方一道弧
     ============================================================ */

  const PLANETS = [
    { id:'earth',   name:'地球', accent:'#2CB8F5', accentD:'#1195DC', onAccent:'#FFFFFF',
      shadow:[14,32,60],  lit:[122,198,238], rim:[214,246,255], atmo:[96,186,255], atmoK:1.00 },
    { id:'mars',    name:'火星', accent:'#F2734A', accentD:'#D2542D', onAccent:'#FFFFFF',
      shadow:[44,20,14],  lit:[216,124,78],  rim:[255,206,168], atmo:[255,138,88],  atmoK:0.55 },
    { id:'moon',    name:'月球', accent:'#AFC0D2', accentD:'#8DA0B5', onAccent:'#121B29',
      shadow:[24,26,32],  lit:[198,204,214], rim:[242,246,252], atmo:[168,190,216], atmoK:0.16 },
    { id:'jupiter', name:'木星', accent:'#E8A85C', accentD:'#C9873C', onAccent:'#241704',
      shadow:[44,30,18],  lit:[228,188,138], rim:[255,236,206], atmo:[240,190,130], atmoK:0.80 },
    { id:'saturn',  name:'土星', accent:'#E3C77E', accentD:'#C2A55C', onAccent:'#241D06',
      shadow:[40,34,20],  lit:[228,206,146], rim:[255,246,214], atmo:[236,214,150], atmoK:0.66 }
  ];

  let theme = PLANETS[0];

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');

  const DEG = Math.PI / 180;
  const TILT = 75 * DEG;   // 球體傾角：把極點推到畫面外下方，經線往下收斂
  const STEP_LAT = 0.62;   // 緯度取樣間隔（度）
  const STEP_LON = 0.45;   // 經度取樣間隔：比緯度密一點，弧線才不會斷成放射狀條紋

  // 光源在左上（指向光源的單位向量，+x 右 / +y 上 / +z 朝向觀者）
  const LIGHT = (() => {
    const v = [-0.66, 0.42, 0.62];
    const n = Math.hypot(v[0], v[1], v[2]);
    return [v[0]/n, v[1]/n, v[2]/n];
  })();

  function drawScene(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = window.innerWidth  || document.documentElement.clientWidth;
    const cssH = window.innerHeight || document.documentElement.clientHeight;

    // 版面尺寸還沒就緒（隱藏 iframe、首次 paint 前）就等下一幀，避免算出 NaN
    if (!cssW || !cssH){ requestAnimationFrame(drawScene); return; }

    const W = Math.round(cssW * dpr);
    const H = Math.round(cssH * dpr);
    canvas.width = W;  canvas.style.width  = cssW + 'px';
    canvas.height = H; canvas.style.height = cssH + 'px';

    // --- 球體幾何：球心在畫面下方很深處，只露出頂端一道弧 ---
    const R  = Math.max(W * 0.92, H * 1.15);
    const horizonY = H * 0.53;      // 弧頂（地平線）高度
    const cx = W * 0.5;
    const cy = horizonY + R;

    const AT = theme.atmo, AK = theme.atmoK;
    const atmo = (a) => `rgba(${AT[0]},${AT[1]},${AT[2]},${(a * AK).toFixed(3)})`;

    // --- 太空底色 ---
    const space = ctx.createLinearGradient(0, 0, 0, H);
    space.addColorStop(0,    '#05080F');
    space.addColorStop(0.55, '#070C16');
    space.addColorStop(1,    '#080E1A');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = space;
    ctx.fillRect(0, 0, W, H);

    // --- 星星（凍結座標 × 畫布尺寸）---
    for (const st of STARS){
      const x = st.x * W, y = st.y * H;
      const r = st.s * dpr;
      ctx.fillStyle = `hsla(${st.h},68%,${80 + st.m * 18}%,${(0.14 + st.m * 0.72).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 6.283185);
      ctx.fill();
      if (st.m > 0.88){                        // 極少數亮星帶一圈很淡的柔光
        const gr = r * 4;
        const g = ctx.createRadialGradient(x, y, 0, x, y, gr);
        g.addColorStop(0, `hsla(${st.h},80%,90%,${(st.m * 0.13).toFixed(3)})`);
        g.addColorStop(1, 'hsla(205,80%,90%,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - gr, y - gr, gr * 2, gr * 2);
      }
    }

    // --- 星球暗底：遮住地平線以下的星星 ---
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 6.283185);
    ctx.clip();
    const bodyG = ctx.createLinearGradient(0, horizonY, 0, H);
    bodyG.addColorStop(0, '#0A1524');
    bodyG.addColorStop(1, '#03060D');
    ctx.fillStyle = bodyG;
    ctx.fillRect(0, horizonY - 2, W, H - horizonY + 2);
    ctx.restore();

    // --- 地平線外緣的大氣輝光 ---
    ctx.globalCompositeOperation = 'lighter';

    const rIn = R * 1.045, limbIn = R / rIn;
    const gIn = ctx.createRadialGradient(cx, cy, 0, cx, cy, rIn);
    gIn.addColorStop(0, atmo(0));
    gIn.addColorStop(Math.max(0, limbIn - 0.05), atmo(0));
    gIn.addColorStop(Math.max(0, limbIn - 0.005), atmo(0.30));
    gIn.addColorStop(Math.min(1, limbIn + 0.004), atmo(0.38));
    gIn.addColorStop(1, atmo(0));
    ctx.fillStyle = gIn;
    ctx.beginPath(); ctx.arc(cx, cy, rIn, 0, 6.283185); ctx.fill();

    const rOut = R * 1.14, limbOut = R / rOut;
    const gOut = ctx.createRadialGradient(cx, cy, 0, cx, cy, rOut);
    gOut.addColorStop(0, atmo(0));
    gOut.addColorStop(Math.max(0, limbOut - 0.015), atmo(0));
    gOut.addColorStop(Math.min(1, limbOut + 0.015), atmo(0.17));
    gOut.addColorStop(1, atmo(0));
    ctx.fillStyle = gOut;
    ctx.beginPath(); ctx.arc(cx, cy, rOut, 0, 6.283185); ctx.fill();

    // 受光側（左上）的大氣特別亮
    const hx = cx - R * 0.52, hy = cy - R * 0.855;
    const gHi = ctx.createRadialGradient(hx, hy, 0, hx, hy, R * 0.42);
    gHi.addColorStop(0,    atmo(0.30));
    gHi.addColorStop(0.42, atmo(0.11));
    gHi.addColorStop(1,    atmo(0));
    ctx.fillStyle = gHi;
    ctx.fillRect(hx - R * 0.42, hy - R * 0.42, R * 0.84, R * 0.84);

    // --- 經緯粒子點陣 ---
    const cosT = Math.cos(TILT), sinT = Math.sin(TILT);
    const yMin = (cy - H) / R - 0.004;          // 低於此值 = 落在畫面底部之外

    const latFrom = -55, latTo = 85;            // 掃描範圍取寬一點，靠條件式剔除
    const lonFrom =  10, lonTo = 350;

    const nLat = Math.round((latTo - latFrom) / STEP_LAT);
    const nLon = Math.round((lonTo - lonFrom) / STEP_LON);
    const sLat = new Float64Array(nLat), cLat = new Float64Array(nLat);
    for (let i = 0; i < nLat; i++){
      const a = (latFrom + i * STEP_LAT) * DEG;
      sLat[i] = Math.sin(a); cLat[i] = Math.cos(a);
    }
    const sLon = new Float64Array(nLon), cLon = new Float64Array(nLon);
    for (let j = 0; j < nLon; j++){
      const a = (lonFrom + j * STEP_LON) * DEG;
      sLon[j] = Math.sin(a); cLon[j] = Math.cos(a);
    }

    const Lx = LIGHT[0], Ly = LIGHT[1], Lz = LIGHT[2];
    const SH = theme.shadow, LT = theme.lit, RM = theme.rim;

    for (let i = 0; i < nLat; i++){
      const sl = sLat[i], cl = cLat[i];
      for (let j = 0; j < nLon; j++){
        // 球面座標 → 繞 X 軸傾斜
        const x = cl * sLon[j];
        const y = sl;
        const z = cl * cLon[j];

        const ny = y * cosT - z * sinT;
        if (ny < yMin) continue;                // 掉出畫面下緣
        const nz = y * sinT + z * cosT;
        if (nz <= 0) continue;                  // 球體背面
        const nx = x;

        const sx = cx + nx * R;
        if (sx < -4 || sx > W + 4) continue;
        const sy = cy - ny * R;

        // 蘭伯特漫射：左上受光、背面全暗
        let lam = nx * Lx + ny * Ly + nz * Lz;
        if (lam < 0) lam = 0;
        const t = Math.pow(lam, 1.15);

        // 邊緣光：越靠近輪廓（nz → 0）越亮
        const e = 1 - nz;
        const e2 = e * e, e3 = e2 * e;
        const rim = e3 * e3 * e;                // ^7

        let r = SH[0] + (LT[0] - SH[0]) * t;
        let g = SH[1] + (LT[1] - SH[1]) * t;
        let b = SH[2] + (LT[2] - SH[2]) * t;

        // 邊緣光同樣分明暗：受光側的輪廓才真的發亮
        const rm = Math.min(1, rim * (0.18 + 0.82 * t));
        r += (RM[0] - r) * rm;
        g += (RM[1] - g) * rm;
        b += (RM[2] - b) * rm;

        let a = 0.05 + 0.58 * t + 0.42 * rim * (0.12 + 0.88 * t);
        if (a < 0.02) continue;
        if (a > 0.88) a = 0.88;

        const s = (0.72 + t * 1.0 + rim * 0.55) * dpr;

        ctx.fillStyle = 'rgba(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ',' + a.toFixed(3) + ')';
        ctx.fillRect(sx - s * 0.5, sy - s * 0.5, s, s);
      }
    }

    // --- 底部收暗，讓按鈕站得住 ---
    ctx.globalCompositeOperation = 'source-over';
    const vig = ctx.createLinearGradient(0, H * 0.72, 0, H);
    vig.addColorStop(0, 'rgba(4,7,14,0)');
    vig.addColorStop(1, 'rgba(4,7,14,0.62)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, H * 0.72, W, H * 0.28);
  }

  /* ============================================================
     3. 星球頁籤
     ============================================================ */

  const tabsEl = document.getElementById('tabs');

  function selectPlanet(id){
    const next = PLANETS.find(p => p.id === id);
    if (!next) return;
    theme = next;
    document.documentElement.style.setProperty('--accent',    theme.accent);
    document.documentElement.style.setProperty('--accent-d',  theme.accentD);
    document.documentElement.style.setProperty('--on-accent', theme.onAccent);
    for (const el of tabsEl.children){
      el.setAttribute('aria-selected', String(el.dataset.id === id));
    }
    drawScene();     // 星星座標是凍結的，換星球不會讓星空跳動
  }

  for (const p of PLANETS){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.textContent = p.name;
    b.dataset.id = p.id;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(p.id === theme.id));
    b.addEventListener('click', () => selectPlanet(p.id));
    tabsEl.appendChild(b);
  }

  drawScene();

  let resizeTimer = 0;
  let lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener('resize', () => {
    // 行動裝置捲動時網址列伸縮會觸發假 resize，變化太小就忽略
    if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - lastH) < 90) return;
    lastW = window.innerWidth; lastH = window.innerHeight;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawScene, 140);
  });

  /* ============================================================
     4. 計時器
     ============================================================ */

  const TOTAL = 25 * 60 * 1000;

  const elMM = document.getElementById('mm');
  const elSS = document.getElementById('ss');
  const elStatus = document.getElementById('status');
  const elTrack  = document.getElementById('track');
  const btnLaunch = document.getElementById('btnLaunch');
  const btnHold   = document.getElementById('btnHold');
  const btnReturn = document.getElementById('btnReturn');

  let remaining = TOTAL;
  let running = false;
  let endAt = 0;          // 絕對終點時間 → 切到背景分頁也不會少算
  let raf = 0;

  const STATE = { idle:'待命中', running:'推進中', hold:'待機中', done:'任務完成' };

  function render(){
    const s = Math.ceil(remaining / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');
    if (elMM.textContent !== mm) elMM.textContent = mm;
    if (elSS.textContent !== ss){
      elSS.textContent = ss;
      document.title = mm + ':' + ss + ' · 任務計時器';
    }
    elTrack.style.setProperty('--p', (1 - remaining / TOTAL).toFixed(5));
  }

  function setPhase(phase){
    elStatus.textContent = STATE[phase];
    document.body.classList.toggle('is-running', phase === 'running');
    document.body.classList.toggle('is-done', phase === 'done');
  }

  function tick(now){
    if (!running) return;
    remaining = endAt - now;
    if (remaining <= 0){
      remaining = 0;
      running = false;
      render();
      setPhase('done');
      return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }

  function launch(){
    if (running) return;
    if (remaining <= 0) remaining = TOTAL;      // 完成後再按發射 → 重新出發
    running = true;
    endAt = performance.now() + remaining;
    setPhase('running');
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function hold(){
    if (!running) return;
    running = false;
    remaining = Math.max(0, endAt - performance.now());
    cancelAnimationFrame(raf);
    render();
    setPhase('hold');
  }

  function goHome(){
    running = false;
    cancelAnimationFrame(raf);
    remaining = TOTAL;
    render();
    setPhase('idle');
    document.title = '任務計時器 · Mission Timer';
  }

  btnLaunch.addEventListener('click', launch);
  btnHold.addEventListener('click', hold);
  btnReturn.addEventListener('click', goHome);

  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLButtonElement) return;   // 讓按鈕自己處理 Space / Enter
    if (e.key === ' '){ e.preventDefault(); running ? hold() : launch(); }
    else if (e.key === 'r' || e.key === 'R'){ goHome(); }
  });

  // 背景分頁的 rAF 會被節流，切回前景時立刻補算一次
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && running){ cancelAnimationFrame(raf); tick(performance.now()); }
  });

  render();
  setPhase('idle');

  /* ============================================================
     5. 今日台北日出／日落
     取不到就顯示「離線」；這一段全程包在 try/catch 裡，
     不論網路失敗、逾時或回傳格式怪異，都不會影響計時器與背景
     ============================================================ */

  const elSun = document.getElementById('sun');
  const SUN_URL = 'https://api.open-meteo.com/v1/forecast' +
    '?latitude=25.03&longitude=121.56&daily=sunrise,sunset' +
    '&timezone=Asia/Taipei&forecast_days=1';

  // 回傳格式是 "2026-08-09T05:23"，已經是台北當地時間，直接取字串不要再轉時區
  function hhmm(iso){
    const m = /T(\d{2}:\d{2})/.exec(String(iso));
    return m ? m[1] : null;
  }

  function sunOffline(){
    elSun.textContent = '離線';
    elSun.classList.remove('is-ready');
    elSun.classList.add('is-offline');
  }

  async function loadSun(){
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 8000);   // 卡住不要無限等
    try {
      const res = await fetch(SUN_URL, { signal: ctrl.signal, cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const daily = data && data.daily;
      const rise = hhmm(daily && daily.sunrise && daily.sunrise[0]);
      const set  = hhmm(daily && daily.sunset  && daily.sunset[0]);
      if (!rise || !set) throw new Error('unexpected payload');
      elSun.textContent = '日出 ' + rise + ' ／ 日落 ' + set;
      elSun.classList.remove('is-offline');
      elSun.classList.add('is-ready');
    } catch (err) {
      sunOffline();
    } finally {
      clearTimeout(timeout);
    }
  }

  try { loadSun(); } catch (err) { sunOffline(); }
})();
</script>
</body>
</html>
