<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>任務計時器 · Mission Timer</title>
<style>
  :root{
    --bg:      #070C16;
    --ink:     #FFFFFF;
    --muted:   #7C8B9E;
    --accent:  #2CB8F5;
    --accent-d:#1195DC;
    --on-accent:#FFFFFF;
    --accent-soft:rgba(44,184,245,.62);
    --accent-shadow:rgba(44,184,245,.30);
    --clock-ink:#FFFFFF;
    --line:    rgba(255,255,255,.11);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", "JetBrains Mono", Menlo,
            Consolas, "Noto Sans Mono", "Courier New", monospace;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--mono);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  #sky,#sky-warn,#fx{position:fixed;inset:0;width:100%;height:100%;display:block}
  #sky{z-index:0}
  /* 預先算好的紅色版星球，靠 opacity 疊上來，不需要每幀重畫十萬顆粒子 */
  /* opacity 由 JS 每幀連續設定（跟著倒數加深），所以這裡不用 transition 或 keyframes */
  #sky-warn{z-index:1;opacity:0;pointer-events:none}
  #fx{z-index:2;pointer-events:none}

  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  /* ---------- 星球切換頁籤 ---------- */
  .tabs{
    position:fixed;z-index:4;
    top:clamp(14px,3vh,28px);
    right:clamp(14px,3vw,42px);
    display:flex;gap:10px;
  }
  .tab{
    font-family:inherit;
    font-size:clamp(13px,1.5vw,16px);
    font-weight:600;
    letter-spacing:.06em;
    padding:12px 22px;
    border-radius:999px;
    cursor:pointer;
    color:#C2CEDC;
    background:rgba(255,255,255,.04);
    border:1px solid var(--line);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .12s ease;
  }
  .tab:hover:not([aria-selected="true"]){background:rgba(255,255,255,.10);color:#fff}
  .tab:active{transform:translateY(1px)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .tab[aria-selected="true"]{
    background:#EEF3F8;
    border-color:#EEF3F8;
    color:#101A2B;
    box-shadow:0 6px 22px rgba(200,225,255,.16);
  }

  /* ---------- 主體 ---------- */
  .hud{
    position:relative;z-index:3;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14vh 20px 22vh;
  }

  .clock{
    margin:0;
    font-size:clamp(3.4rem,12.5vw,8.4rem);
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    letter-spacing:.01em;
    text-shadow:0 0 70px rgba(120,200,255,.20);
    white-space:nowrap;
    color:var(--clock-ink);      /* 由 JS 隨倒數連續內插，不是靠 class 硬切 */
  }
  .clock .sep{margin:0 .16em;opacity:.9}

  /* ---------- 日出日落 ---------- */
  .sun{
    margin:clamp(14px,2.6vh,24px) 0 0;
    min-height:1.3em;                 /* 先佔位，資料回來時畫面不會跳動 */
    font-size:clamp(12px,1.6vw,15px);
    letter-spacing:.18em;
    text-indent:.18em;
    color:var(--muted);
    transition:color .3s ease,opacity .3s ease;
    opacity:0;
  }
  .sun.is-ready{opacity:1}
  .sun.is-offline{color:#5A6878;opacity:1}

  /* ---------- 進度條 + 火箭 ---------- */
  .track{
    --p:0;
    position:relative;
    width:min(560px,70vw);
    margin-top:clamp(22px,5.2vh,54px);
    height:24px;
  }
  .track-line{
    position:absolute;left:0;right:0;top:50%;
    height:3px;margin-top:-1.5px;
    background:rgba(255,255,255,.14);
    border-radius:999px;
  }
  .track-fill{
    position:absolute;left:0;top:50%;
    height:3px;margin-top:-1.5px;
    width:calc(var(--p) * 100%);
    background:var(--accent);
    border-radius:999px;
    box-shadow:0 0 14px var(--accent-soft);
  }
  .rocket{
    position:absolute;top:50%;
    left:calc(var(--p) * 100%);
    transform:translate(-50%,-50%);
    color:var(--accent);
    pointer-events:none;
    will-change:left;
    filter:drop-shadow(0 0 10px var(--accent-soft));
  }
  .rocket svg{display:block;overflow:visible}
  .rocket .stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .rocket .hull.stroke{fill:#0B1322}   /* 機身填底，進度線不會穿過火箭 */
  .rocket-inner{display:block}
  .rocket .exhaust{opacity:0;transition:opacity .25s ease}
  body.is-running .rocket .exhaust{opacity:1;animation:puff .5s ease-in-out infinite}
  /* bob / shake 掛在內層，外層的 translate(-50%,-50%) 定位才不會被蓋掉 */
  body.is-running .rocket-inner{animation:bob 2.4s ease-in-out infinite}
  @keyframes puff{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes bob{0%,100%{transform:translateY(-.8px)}50%{transform:translateY(.8px)}}

  /* ---------- 最後一分鐘警示 ---------- */
  body.is-warning .rocket{color:#FF5233;filter:drop-shadow(0 0 12px rgba(255,82,51,.85))}
  body.is-warning.is-running .rocket-inner,
  body.is-warning .rocket-inner{animation:shake .11s linear infinite}
  @keyframes shake{
    0%  {transform:translate( 0   , 0   ) rotate(0)}
    20% {transform:translate( 1.4px,-1.1px) rotate(2.5deg)}
    40% {transform:translate(-1.2px, 1.3px) rotate(-2.5deg)}
    60% {transform:translate( 1.1px, 1.2px) rotate(1.8deg)}
    80% {transform:translate(-1.3px,-1.2px) rotate(-1.8deg)}
    100%{transform:translate( 0   , 0   ) rotate(0)}
  }

  /* 最後 10 秒才開始閃，前面靠顏色連續加深就好 */
  body.is-critical .clock{animation:alarm .85s ease-in-out infinite}
  @keyframes alarm{0%,100%{opacity:1}50%{opacity:.55}}

  body.is-warning .sun{color:#8A5B52}
  body.is-done .sun{opacity:0}

  /* ---------- 時間到：熔岩貓的怒吼 ---------- */
  /* 時間到時把進度條讓開，不然線會橫切過貓臉 */
  body.is-done .track,
  body.is-done .track-labels{opacity:0;transition:opacity .45s ease}

  .shout{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%) scale(.6);
    margin:0;
    font-size:clamp(30px,7.4vw,84px);
    font-weight:800;
    letter-spacing:.14em;text-indent:.14em;
    white-space:nowrap;
    color:#FFE9B0;
    text-shadow:0 0 18px rgba(255,120,40,.95),0 0 60px rgba(255,60,10,.75),0 4px 0 rgba(120,20,0,.55);
    opacity:0;
    pointer-events:none;
    z-index:5;
  }
  body.is-shouting .shout{
    animation:shoutIn .42s cubic-bezier(.2,1.5,.4,1) forwards,
              shoutShake .13s linear .42s infinite;
  }
  @keyframes shoutIn{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(.55)}
    70% {opacity:1;transform:translate(-50%,-50%) scale(1.12)}
    100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  }
  @keyframes shoutShake{
    0%  {transform:translate(-50%,-50%) scale(1)   rotate(0)}
    25% {transform:translate(-51%,-50.6%) scale(1.02) rotate(-1.1deg)}
    50% {transform:translate(-49%,-49.4%) scale(1)    rotate(1.1deg)}
    75% {transform:translate(-50.6%,-50.4%) scale(1.02) rotate(-.6deg)}
    100%{transform:translate(-50%,-50%) scale(1)   rotate(0)}
  }

  .track-labels{
    display:flex;justify-content:space-between;
    width:min(560px,70vw);
    margin-top:12px;
    font-size:clamp(12px,1.5vw,15px);
    letter-spacing:.14em;
    color:var(--muted);
  }

  /* ---------- 按鈕 ---------- */
  .controls{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    margin-top:clamp(38px,10vh,104px);
  }
  .btn{
    font-family:inherit;
    font-size:clamp(15px,1.9vw,20px);
    font-weight:700;
    letter-spacing:.16em;text-indent:.16em;
    padding:18px 40px;
    border-radius:22px;
    cursor:pointer;
    color:#C2CEDC;
    background:rgba(14,23,38,.66);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:background .18s ease,color .18s ease,border-color .18s ease,
               transform .12s ease,box-shadow .18s ease,opacity .18s ease;
  }
  .btn:hover:not(:disabled){background:rgba(30,45,68,.82);color:#fff;border-color:rgba(255,255,255,.26)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .btn-primary{
    color:var(--on-accent);
    background:linear-gradient(180deg,var(--accent),var(--accent-d));
    border-color:transparent;
    box-shadow:0 10px 30px var(--accent-shadow);
  }
  .btn-primary:hover:not(:disabled){
    color:var(--on-accent);
    background:linear-gradient(180deg,#48C5F8,#1AA2E8);
    border-color:transparent;
    box-shadow:0 0 0 6px rgba(44,184,245,.14),0 10px 34px rgba(44,184,245,.38);
  }

  @media (max-width:640px){
    .tabs{
      left:0;right:0;justify-content:center;flex-wrap:wrap;
      padding:0 12px;gap:8px;
    }
    .tab{padding:9px 15px;font-size:13px}
    .hud{padding:20vh 16px 24vh}
    .btn{padding:15px 22px}
  }

  @media (prefers-reduced-motion:reduce){
    body.is-running .rocket-inner,
    body.is-running .rocket .exhaust,
    body.is-critical .clock,
    body.is-shouting .shout{animation:none}
    .btn,.tab{transition:none}
    /* 動畫關掉，但紅色警示與怒吼保留 —— 訊息不能因為偏好設定而消失 */
    body.is-shouting .shout{opacity:1;transform:translate(-50%,-50%) scale(1)}
  }
</style>
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="sky-warn" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<nav class="tabs" id="tabs" role="tablist" aria-label="選擇星球"></nav>

<main class="hud">
  <h1 class="clock" id="clock"><span id="mm">25</span><span class="sep">:</span><span id="ss">00</span></h1>

  <p class="sun" id="sun" aria-live="polite"></p>

  <div class="track" id="track">
    <div class="track-line"></div>
    <div class="track-fill"></div>
    <span class="rocket" id="rocket" aria-hidden="true"><span class="rocket-inner">
      <svg viewBox="0 0 44 28" width="40" height="25">
        <g class="exhaust">
          <path class="stroke" d="M6.5 14 L0.5 14" stroke-width="1.8" opacity=".9"/>
          <path class="stroke" d="M8 10.4 L3.5 8.6" stroke-width="1.3" opacity=".45"/>
          <path class="stroke" d="M8 17.6 L3.5 19.4" stroke-width="1.3" opacity=".45"/>
        </g>
        <!-- 後掠尾翼（先畫，機身會蓋住翼根）-->
        <path class="hull stroke" d="M19 8.6 L12 8.6 L9.5 3.4 Z"/>
        <path class="hull stroke" d="M19 19.4 L12 19.4 L9.5 24.6 Z"/>
        <!-- 機身：圓尾、尖鼻朝右 -->
        <path class="hull stroke"
              d="M11 8.6 L26 8.6 C 32.5 8.6, 38 10.9, 41 14
                 C 38 17.1, 32.5 19.4, 26 19.4 L11 19.4
                 C 8 19.4, 8 8.6, 11 8.6 Z"/>
        <circle class="hull stroke" cx="27" cy="14" r="2.7" stroke-width="1.7"/>
      </svg>
    </span></span>
  </div>

  <div class="track-labels"><span>啟程</span><span>抵達</span></div>

  <div class="controls">
    <button type="button" class="btn btn-primary" id="btnLaunch">發射</button>
    <button type="button" class="btn" id="btnHold">待機</button>
    <button type="button" class="btn" id="btnReturn">返航</button>
  </div>

  <p class="shout" id="shout" aria-hidden="true">TIME'S UP</p>

  <p class="sr-only" id="status" aria-live="polite">待命中</p>
</main>

<script>
(() => {
  'use strict';

  /* ============================================================
     0. 設定 — 想調時間只要改這裡，不要散到下面的程式碼裡
     ============================================================ */

  const MINUTES       = 25;   // 一次任務的長度（分鐘）
  const WARN_MINS     = 1;    // 剩下幾分鐘開始警示（星球轉紅、岩漿噴發）
  const CRITICAL_SECS = 10;   // 剩下幾秒開始閃爍數字

  const TOTAL       = MINUTES       * 60 * 1000;
  const WARN_MS     = WARN_MINS     * 60 * 1000;
  const CRITICAL_MS = CRITICAL_SECS      * 1000;

  /* ============================================================
     1. 星空 — 座標載入時算一次就凍結，之後任何重繪（resize、換星球）
        都只是拿同一組數字乘上畫布尺寸，所以星星不會跳動
     ============================================================ */

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const STARS = (() => {
    const rnd = mulberry32(20260809);
    const out = [];
    for (let i = 0; i < 380; i++){
      const mag = Math.pow(rnd(), 2.6);            // 多數暗、少數亮
      out.push({
        x: rnd(),
        y: Math.pow(rnd(), 0.85) * 0.86,           // 偏上分布（下方被星球遮住）
        m: mag,
        s: 0.34 + mag * 1.05,
        h: rnd() < 0.16 ? 36 : 205                 // 少數偏暖，其餘冷白
      });
    }
    return Object.freeze(out);
  })();

  /* ============================================================
     2. 星球 — 經緯排列的粒子點陣，只露出畫面下方一道弧
     ============================================================ */

  const PLANETS = [
    { id:'earth',   name:'地球', accent:'#2CB8F5', accentD:'#1195DC', onAccent:'#FFFFFF',
      shadow:[14,32,60],  lit:[122,198,238], rim:[214,246,255], atmo:[96,186,255], atmoK:1.00 },
    { id:'mars',    name:'火星', accent:'#F2734A', accentD:'#D2542D', onAccent:'#FFFFFF',
      shadow:[44,20,14],  lit:[216,124,78],  rim:[255,206,168], atmo:[255,138,88],  atmoK:0.55 },
    { id:'moon',    name:'月球', accent:'#AFC0D2', accentD:'#8DA0B5', onAccent:'#121B29',
      shadow:[24,26,32],  lit:[198,204,214], rim:[242,246,252], atmo:[168,190,216], atmoK:0.16 },
    { id:'jupiter', name:'木星', accent:'#E8A85C', accentD:'#C9873C', onAccent:'#241704',
      shadow:[44,30,18],  lit:[228,188,138], rim:[255,236,206], atmo:[240,190,130], atmoK:0.80 },
    { id:'saturn',  name:'土星', accent:'#E3C77E', accentD:'#C2A55C', onAccent:'#241D06',
      shadow:[40,34,20],  lit:[228,206,146], rim:[255,246,214], atmo:[236,214,150], atmoK:0.66 }
  ];

  let theme = PLANETS[0];

  // 最後一分鐘的警示配色（所有星球共用同一組，警示訊號要一致）
  const ALERT_PAL = {
    shadow:[48,8,6], lit:[238,88,44], rim:[255,198,132], atmo:[255,72,38], atmoK:1.25,
    bodyTop:'#1C0705', bodyBot:'#0A0202'
  };

  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const warnCv = document.getElementById('sky-warn');
  const warnCtx = warnCv.getContext('2d');
  const fxCv = document.getElementById('fx');
  const fxCtx = fxCv.getContext('2d');

  // 幾何資料存起來，岩漿粒子要沿著同一道地平線噴發
  const geom = { W:0, H:0, dpr:1, cx:0, cy:0, R:0, horizonY:0 };
  let alertReady = false;      // 紅色版是否已算好（只跟畫布尺寸有關，跟星球無關）

  const DEG = Math.PI / 180;
  const TILT = 75 * DEG;   // 球體傾角：把極點推到畫面外下方，經線往下收斂
  const STEP_LAT = 0.62;   // 緯度取樣間隔（度）
  const STEP_LON = 0.45;   // 經度取樣間隔：比緯度密一點，弧線才不會斷成放射狀條紋

  // 光源在左上（指向光源的單位向量，+x 右 / +y 上 / +z 朝向觀者）
  const LIGHT = (() => {
    const v = [-0.66, 0.42, 0.62];
    const n = Math.hypot(v[0], v[1], v[2]);
    return [v[0]/n, v[1]/n, v[2]/n];
  })();

  // 把整個場景畫進指定的 2D context，用指定的配色。
  // 一般版與紅色警示版共用這一份程式，只換 pal。
  function paintScene(ctx, pal){
    const { W, H, dpr, R, cx, cy, horizonY } = geom;

    const AT = pal.atmo, AK = pal.atmoK;
    const atmo = (a) => `rgba(${AT[0]},${AT[1]},${AT[2]},${(a * AK).toFixed(3)})`;

    // --- 太空底色 ---
    const space = ctx.createLinearGradient(0, 0, 0, H);
    space.addColorStop(0,    '#05080F');
    space.addColorStop(0.55, '#070C16');
    space.addColorStop(1,    '#080E1A');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = space;
    ctx.fillRect(0, 0, W, H);

    // --- 星星（凍結座標 × 畫布尺寸）---
    for (const st of STARS){
      const x = st.x * W, y = st.y * H;
      const r = st.s * dpr;
      ctx.fillStyle = `hsla(${st.h},68%,${80 + st.m * 18}%,${(0.14 + st.m * 0.72).toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 6.283185);
      ctx.fill();
      if (st.m > 0.88){                        // 極少數亮星帶一圈很淡的柔光
        const gr = r * 4;
        const g = ctx.createRadialGradient(x, y, 0, x, y, gr);
        g.addColorStop(0, `hsla(${st.h},80%,90%,${(st.m * 0.13).toFixed(3)})`);
        g.addColorStop(1, 'hsla(205,80%,90%,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - gr, y - gr, gr * 2, gr * 2);
      }
    }

    // --- 星球暗底：遮住地平線以下的星星 ---
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, 6.283185);
    ctx.clip();
    const bodyG = ctx.createLinearGradient(0, horizonY, 0, H);
    bodyG.addColorStop(0, pal.bodyTop || '#0A1524');
    bodyG.addColorStop(1, pal.bodyBot || '#03060D');
    ctx.fillStyle = bodyG;
    ctx.fillRect(0, horizonY - 2, W, H - horizonY + 2);
    ctx.restore();

    // --- 地平線外緣的大氣輝光 ---
    ctx.globalCompositeOperation = 'lighter';

    const rIn = R * 1.045, limbIn = R / rIn;
    const gIn = ctx.createRadialGradient(cx, cy, 0, cx, cy, rIn);
    gIn.addColorStop(0, atmo(0));
    gIn.addColorStop(Math.max(0, limbIn - 0.05), atmo(0));
    gIn.addColorStop(Math.max(0, limbIn - 0.005), atmo(0.30));
    gIn.addColorStop(Math.min(1, limbIn + 0.004), atmo(0.38));
    gIn.addColorStop(1, atmo(0));
    ctx.fillStyle = gIn;
    ctx.beginPath(); ctx.arc(cx, cy, rIn, 0, 6.283185); ctx.fill();

    const rOut = R * 1.14, limbOut = R / rOut;
    const gOut = ctx.createRadialGradient(cx, cy, 0, cx, cy, rOut);
    gOut.addColorStop(0, atmo(0));
    gOut.addColorStop(Math.max(0, limbOut - 0.015), atmo(0));
    gOut.addColorStop(Math.min(1, limbOut + 0.015), atmo(0.17));
    gOut.addColorStop(1, atmo(0));
    ctx.fillStyle = gOut;
    ctx.beginPath(); ctx.arc(cx, cy, rOut, 0, 6.283185); ctx.fill();

    // 受光側（左上）的大氣特別亮
    const hx = cx - R * 0.52, hy = cy - R * 0.855;
    const gHi = ctx.createRadialGradient(hx, hy, 0, hx, hy, R * 0.42);
    gHi.addColorStop(0,    atmo(0.30));
    gHi.addColorStop(0.42, atmo(0.11));
    gHi.addColorStop(1,    atmo(0));
    ctx.fillStyle = gHi;
    ctx.fillRect(hx - R * 0.42, hy - R * 0.42, R * 0.84, R * 0.84);

    // --- 經緯粒子點陣 ---
    const cosT = Math.cos(TILT), sinT = Math.sin(TILT);
    const yMin = (cy - H) / R - 0.004;          // 低於此值 = 落在畫面底部之外

    const latFrom = -55, latTo = 85;            // 掃描範圍取寬一點，靠條件式剔除
    const lonFrom =  10, lonTo = 350;

    const nLat = Math.round((latTo - latFrom) / STEP_LAT);
    const nLon = Math.round((lonTo - lonFrom) / STEP_LON);
    const sLat = new Float64Array(nLat), cLat = new Float64Array(nLat);
    for (let i = 0; i < nLat; i++){
      const a = (latFrom + i * STEP_LAT) * DEG;
      sLat[i] = Math.sin(a); cLat[i] = Math.cos(a);
    }
    const sLon = new Float64Array(nLon), cLon = new Float64Array(nLon);
    for (let j = 0; j < nLon; j++){
      const a = (lonFrom + j * STEP_LON) * DEG;
      sLon[j] = Math.sin(a); cLon[j] = Math.cos(a);
    }

    const Lx = LIGHT[0], Ly = LIGHT[1], Lz = LIGHT[2];
    const SH = pal.shadow, LT = pal.lit, RM = pal.rim;

    for (let i = 0; i < nLat; i++){
      const sl = sLat[i], cl = cLat[i];
      for (let j = 0; j < nLon; j++){
        // 球面座標 → 繞 X 軸傾斜
        const x = cl * sLon[j];
        const y = sl;
        const z = cl * cLon[j];

        const ny = y * cosT - z * sinT;
        if (ny < yMin) continue;                // 掉出畫面下緣
        const nz = y * sinT + z * cosT;
        if (nz <= 0) continue;                  // 球體背面
        const nx = x;

        const sx = cx + nx * R;
        if (sx < -4 || sx > W + 4) continue;
        const sy = cy - ny * R;

        // 蘭伯特漫射：左上受光、背面全暗
        let lam = nx * Lx + ny * Ly + nz * Lz;
        if (lam < 0) lam = 0;
        const t = Math.pow(lam, 1.15);

        // 邊緣光：越靠近輪廓（nz → 0）越亮
        const e = 1 - nz;
        const e2 = e * e, e3 = e2 * e;
        const rim = e3 * e3 * e;                // ^7

        let r = SH[0] + (LT[0] - SH[0]) * t;
        let g = SH[1] + (LT[1] - SH[1]) * t;
        let b = SH[2] + (LT[2] - SH[2]) * t;

        // 邊緣光同樣分明暗：受光側的輪廓才真的發亮
        const rm = Math.min(1, rim * (0.18 + 0.82 * t));
        r += (RM[0] - r) * rm;
        g += (RM[1] - g) * rm;
        b += (RM[2] - b) * rm;

        let a = 0.05 + 0.58 * t + 0.42 * rim * (0.12 + 0.88 * t);
        if (a < 0.02) continue;
        if (a > 0.88) a = 0.88;

        const s = (0.72 + t * 1.0 + rim * 0.55) * dpr;

        ctx.fillStyle = 'rgba(' + (r|0) + ',' + (g|0) + ',' + (b|0) + ',' + a.toFixed(3) + ')';
        ctx.fillRect(sx - s * 0.5, sy - s * 0.5, s, s);
      }
    }

    // --- 底部收暗，讓按鈕站得住 ---
    ctx.globalCompositeOperation = 'source-over';
    const vig = ctx.createLinearGradient(0, H * 0.72, 0, H);
    vig.addColorStop(0, 'rgba(4,7,14,0)');
    vig.addColorStop(1, 'rgba(4,7,14,0.62)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, H * 0.72, W, H * 0.28);
  }

  function sizeCanvas(c, cssW, cssH, W, H){
    c.width = W;  c.style.width  = cssW + 'px';
    c.height = H; c.style.height = cssH + 'px';
  }

  function drawScene(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cssW = window.innerWidth  || document.documentElement.clientWidth;
    const cssH = window.innerHeight || document.documentElement.clientHeight;

    // 版面尺寸還沒就緒（隱藏 iframe、首次 paint 前）就等下一幀，避免算出 NaN
    if (!cssW || !cssH){ requestAnimationFrame(drawScene); return; }

    const W = Math.round(cssW * dpr);
    const H = Math.round(cssH * dpr);

    sizeCanvas(canvas, cssW, cssH, W, H);
    sizeCanvas(warnCv, cssW, cssH, W, H);
    sizeCanvas(fxCv,   cssW, cssH, W, H);

    // --- 球體幾何：球心在畫面下方很深處，只露出頂端一道弧 ---
    geom.W = W; geom.H = H; geom.dpr = dpr;
    geom.R = Math.max(W * 0.92, H * 1.15);
    geom.horizonY = H * 0.53;          // 弧頂（地平線）高度
    geom.cx = W * 0.5;
    geom.cy = geom.horizonY + geom.R;

    paintScene(ctx, theme);

    // 紅色版只跟尺寸有關，換星球不必重畫
    alertReady = false;
    scheduleAlertRender();
  }

  // 紅色版很貴（十萬顆粒子），趁空檔先算好，才不會在剩 1 分鐘那一刻卡住
  let alertJob = 0, alertJobIsIdle = false;
  function renderAlertLayer(){
    if (alertReady || !geom.W) return;
    paintScene(warnCtx, ALERT_PAL);
    alertReady = true;
  }
  function scheduleAlertRender(){
    if (alertJob){
      if (alertJobIsIdle && window.cancelIdleCallback) window.cancelIdleCallback(alertJob);
      else if (!alertJobIsIdle) clearTimeout(alertJob);
      alertJob = 0;
    }
    if (window.requestIdleCallback){
      alertJobIsIdle = true;
      alertJob = window.requestIdleCallback(renderAlertLayer, { timeout: 3000 });
    } else {
      alertJobIsIdle = false;
      alertJob = setTimeout(renderAlertLayer, 400);
    }
  }

  /* ============================================================
     3. 星球頁籤
     ============================================================ */

  const tabsEl = document.getElementById('tabs');

  /* ---- 主色隨倒數連續內插到警示紅（不是靠 class 硬切）---- */

  const ALERT_ACCENT  = [255, 74, 46];
  const ALERT_ACCENTD = [201, 48, 15];
  const ALERT_INK     = [255, 82, 51];
  const WHITE_INK     = [255, 255, 255];

  // 藍直接內插到紅會從灰色中間值穿過去，整個畫面會發灰。
  // 中間插一個橘色停靠點，看起來才像「逐漸加熱」而不是「褪色」。
  const HOT_MID   = [255, 150, 52];
  const HOT_MID_D = [214, 108, 26];
  const HOT_INK   = [255, 198, 126];

  function hex2rgb(h){
    h = h.replace('#', '');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function mix(a, b, t){
    return [Math.round(a[0]+(b[0]-a[0])*t),
            Math.round(a[1]+(b[1]-a[1])*t),
            Math.round(a[2]+(b[2]-a[2])*t)];
  }
  const rgb  = (c)    => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
  const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';

  let lastAccentLevel = -1;
  function applyAccent(level){
    if (Math.abs(level - lastAccentLevel) < 0.004) return;   // 避免每幀都寫 CSS
    lastAccentLevel = level;

    // 兩段式：前半段升溫到橘，後半段再燒到紅
    const heat = (from, midC, to) => level < 0.5
      ? mix(from, midC, level * 2)
      : mix(midC, to, (level - 0.5) * 2);

    const a   = heat(hex2rgb(theme.accent),  HOT_MID,   ALERT_ACCENT);
    const aD  = heat(hex2rgb(theme.accentD), HOT_MID_D, ALERT_ACCENTD);
    const ink = heat(WHITE_INK,              HOT_INK,   ALERT_INK);

    const s = document.documentElement.style;
    s.setProperty('--accent',       rgb(a));
    s.setProperty('--accent-d',     rgb(aD));
    s.setProperty('--accent-soft',  rgba(a, 0.62));
    s.setProperty('--accent-shadow',rgba(a, 0.32));
    s.setProperty('--clock-ink',    rgb(ink));
    // 底色轉紅之後，深色字在紅底上會看不清楚，過半就換白字
    s.setProperty('--on-accent', level > 0.45 ? '#FFFFFF' : theme.onAccent);
  }

  function selectPlanet(id){
    const next = PLANETS.find(p => p.id === id);
    if (!next) return;
    theme = next;
    lastAccentLevel = -1;
    applyAccent(warnLevel);
    for (const el of tabsEl.children){
      el.setAttribute('aria-selected', String(el.dataset.id === id));
    }
    drawScene();     // 星星座標是凍結的，換星球不會讓星空跳動
  }

  for (const p of PLANETS){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab';
    b.textContent = p.name;
    b.dataset.id = p.id;
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(p.id === theme.id));
    b.addEventListener('click', () => selectPlanet(p.id));
    tabsEl.appendChild(b);
  }

  drawScene();

  let resizeTimer = 0;
  let lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener('resize', () => {
    // 行動裝置捲動時網址列伸縮會觸發假 resize，變化太小就忽略
    if (Math.abs(window.innerWidth - lastW) < 2 && Math.abs(window.innerHeight - lastH) < 90) return;
    lastW = window.innerWidth; lastH = window.innerHeight;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawScene, 140);

  /* ============================================================
     4. 計時器
     ============================================================ */

  const elMM = document.getElementById('mm');
  const elSS = document.getElementById('ss');
  const elStatus = document.getElementById('status');
  const elTrack  = document.getElementById('track');
  const btnLaunch = document.getElementById('btnLaunch');
  const btnHold   = document.getElementById('btnHold');
  const btnReturn = document.getElementById('btnReturn');

  let remaining = TOTAL;
  let running = false;
  let endAt = 0;          // 絕對終點時間 → 切到背景分頁也不會少算
  let raf = 0;

  const STATE = { idle:'待命中', running:'推進中', hold:'待機中', done:'任務完成' };

  /* ---- 最後一分鐘警示：紅色星球 + 沿地平線噴發的岩漿 ---- */

  const REDUCE_MOTION = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let warnOn = false;
  let urgency = 0;          // 0（剩 60 秒）→ 1（歸零），噴發強度跟著它走
  let warnLevel = 0;        // UI 升溫強度
  let planetLevel = 0;      // 星球轉紅的強度（比 UI 晚一點才上來）
  let sparks = [];
  let fxRaf = 0, fxLast = 0, fxU = 0;

  // 時間到之後從地平線後方跳出來的熔岩貓
  let devilOn = false, devilT0 = 0;

  const elShout = document.getElementById('shout');
  const rocketInner = document.querySelector('.rocket-inner');

  function spawnSpark(){
    const { cx, cy, R, H, dpr } = geom;
    // 可見的那道弧：以球心為圓心，落在畫面內的角度範圍
    const c = (cy - H) / R;
    const aMax = Math.acos(Math.max(-1, Math.min(1, c)));
    const a = (Math.random() * 2 - 1) * aMax;

    const nx = Math.sin(a), ny = -Math.cos(a);      // 地平線的外法線
    const speed = (1.3 + Math.random() * 3.4) * dpr * (0.5 + fxU * 1.15);
    const spread = (Math.random() - 0.5) * 0.55;    // 稍微散開，不要像噴泉一樣直
    const dx = nx * Math.cos(spread) - ny * Math.sin(spread);
    const dy = nx * Math.sin(spread) + ny * Math.cos(spread);

    sparks.push({
      x: cx + R * nx, y: cy + R * ny,
      vx: dx * speed, vy: dy * speed,
      gx: -nx * 0.052 * dpr, gy: -ny * 0.052 * dpr,   // 重力朝星球中心拉回去
      life: 1,
      decay: 0.005 + Math.random() * 0.009,
      size: (1.5 + Math.random() * 3.2) * dpr,
      big: Math.random() < 0.18            // 少數大顆熔岩塊，帶一圈餘暉
    });
  }

  /* ---- 熔岩貓 ---- */

  function drawLavaCat(now){
    const { W, H, cx, cy, R, horizonY } = geom;
    const s = H * 0.125;
    const t = (now - devilT0) / 1000;          // 秒

    // --- 跳躍：蓄力 → 彈出 → 過頂 → 落下 → 著地壓縮 ---
    // h 的單位是 s：0 = 站在地平線上，負值 = 還埋在地平線下
    const easeOut = (k) => 1 - (1 - k) * (1 - k);
    const easeIn  = (k) => k * k;
    let h, sx = 1, sy = 1;

    if (t < 0.10){                              // 蓄力，還躲在地平線後面
      h = -2.30; sx = 1.14; sy = 0.88;
    } else if (t < 0.50){                       // 彈射，身體拉長
      const k = (t - 0.10) / 0.40;
      h = -2.30 + 2.60 * easeOut(k);
      sx = 0.90 + 0.10 * k; sy = 1.20 - 0.15 * k;
    } else if (t < 0.82){                       // 越過頂點往下掉
      const k = (t - 0.50) / 0.32;
      h = 0.30 - 0.58 * easeIn(k);
      sx = 1.00 + 0.04 * k; sy = 1.05 - 0.03 * k;
    } else if (t < 1.02){                       // 著地壓縮
      const k = (t - 0.82) / 0.20;
      h = -0.28; sx = 1.20 - 0.20 * k; sy = 0.80 + 0.20 * k;
    } else {                                    // 蹲著喘氣
      h = -0.28 + 0.022 * Math.sin((t - 1.02) * 2.4);
    }

    const baseY = horizonY - h * s;
    const appear = Math.min(1, Math.max(0, (t - 0.08) / 0.35));

    fxCtx.save();
    // 只畫在星球輪廓「之外」，才像是從地平線後面竄出來
    fxCtx.beginPath();
    fxCtx.rect(0, 0, W, H);
    fxCtx.arc(cx, cy, R, 0, 6.283185);
    fxCtx.clip('evenodd');

    // 背後的熔岩光暈
    const gy = baseY - s * 1.05;
    const gl = fxCtx.createRadialGradient(cx, gy, 0, cx, gy, s * 3.0);
    gl.addColorStop(0,   'rgba(255,124,48,' + (0.42 * appear).toFixed(3) + ')');
    gl.addColorStop(0.45,'rgba(255,66,20,'  + (0.17 * appear).toFixed(3) + ')');
    gl.addColorStop(1,   'rgba(255,40,10,0)');
    fxCtx.globalCompositeOperation = 'lighter';
    fxCtx.fillStyle = gl;
    fxCtx.fillRect(cx - s * 3, gy - s * 3, s * 6, s * 6);

    fxCtx.globalCompositeOperation = 'source-over';
    fxCtx.translate(cx, baseY);
    fxCtx.scale(s * sx, s * sy);

    const molten = fxCtx.createLinearGradient(0, 0.1, 0, -2.0);
    molten.addColorStop(0,    '#FFC152');
    molten.addColorStop(0.28, '#F4571B');
    molten.addColorStop(0.62, '#931506');
    molten.addColorStop(1,    '#3A0701');

    // --- 尾巴（先畫，根部會被身體蓋住）---
    fxCtx.strokeStyle = molten;
    fxCtx.lineWidth = 0.19;
    fxCtx.lineCap = 'round';
    fxCtx.beginPath();
    fxCtx.moveTo(0.86, -0.10);
    fxCtx.bezierCurveTo(1.52, -0.16, 1.86, -0.86, 1.44, -1.46);
    fxCtx.stroke();

    // --- 身體 + 頭 + 兩隻貓耳 ---
    fxCtx.beginPath();
    fxCtx.moveTo(-1.02, 0.05);
    fxCtx.bezierCurveTo(-0.98, -0.48, -0.74, -0.70, -0.54, -0.80);
    fxCtx.bezierCurveTo(-0.74, -0.94, -0.80, -1.22, -0.68, -1.38);
    fxCtx.lineTo(-0.82, -1.94);                                    // 左耳尖
    fxCtx.lineTo(-0.34, -1.60);
    fxCtx.bezierCurveTo(-0.14, -1.71, 0.14, -1.71, 0.34, -1.60);   // 頭頂
    fxCtx.lineTo(0.82, -1.94);                                     // 右耳尖
    fxCtx.lineTo(0.68, -1.38);
    fxCtx.bezierCurveTo(0.80, -1.22, 0.74, -0.94, 0.54, -0.80);
    fxCtx.bezierCurveTo(0.74, -0.70, 0.98, -0.48, 1.02, 0.05);
    fxCtx.closePath();
    fxCtx.fillStyle = molten;
    fxCtx.fill();

    // --- 鬍鬚 ---
    fxCtx.globalCompositeOperation = 'lighter';
    fxCtx.strokeStyle = 'rgba(255,196,120,.5)';
    fxCtx.lineWidth = 0.024;
    const whiskers = [
      [-0.28,-1.00,-1.16,-1.14], [-0.28,-0.95,-1.22,-0.94], [-0.28,-0.90,-1.14,-0.72],
      [ 0.28,-1.00, 1.16,-1.14], [ 0.28,-0.95, 1.22,-0.94], [ 0.28,-0.90, 1.14,-0.72]
    ];
    fxCtx.beginPath();
    for (const w of whiskers){ fxCtx.moveTo(w[0], w[1]); fxCtx.lineTo(w[2], w[3]); }
    fxCtx.stroke();

    // --- 發光的貓眼（直立瞳孔）---
    const flick = 0.86 + 0.14 * Math.sin(now / 70);
    for (const e of [[-0.23, -1], [0.23, 1]]){
      fxCtx.save();
      fxCtx.translate(e[0], -1.20);
      fxCtx.rotate(e[1] * 0.20);
      fxCtx.globalCompositeOperation = 'lighter';
      const eg = fxCtx.createRadialGradient(0, 0, 0, 0, 0, 0.19);
      eg.addColorStop(0,   'rgba(255,250,224,' + (0.98 * flick).toFixed(3) + ')');
      eg.addColorStop(0.42,'rgba(255,186,52,'  + (0.82 * flick).toFixed(3) + ')');
      eg.addColorStop(1,   'rgba(255,90,0,0)');
      fxCtx.fillStyle = eg;
      fxCtx.beginPath(); fxCtx.ellipse(0, 0, 0.19, 0.11, 0, 0, 6.283185); fxCtx.fill();
      fxCtx.globalCompositeOperation = 'source-over';
      fxCtx.fillStyle = 'rgba(72,12,0,.92)';
      fxCtx.beginPath(); fxCtx.ellipse(0, 0, 0.025, 0.072, 0, 0, 6.283185); fxCtx.fill();
      fxCtx.restore();
    }

    // --- 張口咆哮 ---
    const open = (0.15 + 0.06 * Math.sin(now / 80)) * appear;
    fxCtx.globalCompositeOperation = 'source-over';
    fxCtx.beginPath();
    fxCtx.moveTo(-0.19, -1.00);
    fxCtx.quadraticCurveTo(0, -1.05, 0.19, -1.00);
    fxCtx.quadraticCurveTo(0, -1.00 + open * 2.6, -0.19, -1.00);
    fxCtx.closePath();
    fxCtx.fillStyle = 'rgba(255,228,140,.95)';
    fxCtx.fill();
    fxCtx.fillStyle = 'rgba(255,255,240,.95)';                     // 尖牙
    fxCtx.beginPath();
    fxCtx.moveTo(-0.13, -1.00); fxCtx.lineTo(-0.07, -1.00); fxCtx.lineTo(-0.10, -1.00 + open * 1.1);
    fxCtx.moveTo( 0.13, -1.00); fxCtx.lineTo( 0.07, -1.00); fxCtx.lineTo( 0.10, -1.00 + open * 1.1);
    fxCtx.fill();

    fxCtx.restore();
  }

  function fxTick(now){
    const { W, H, cx, cy, R, dpr } = geom;
    let dt = (now - fxLast) / 16.667;
    if (!isFinite(dt) || dt <= 0) dt = 1;
    if (dt > 3) dt = 3;                    // 分頁切回來時不要瞬間跳一大步
    fxLast = now;

    const u = devilOn ? 1 : urgency;       // 魔物出場時火力全開

    fxCtx.clearRect(0, 0, W, H);

    // 紅色星球的濃度也在這裡連續調整（含心跳般的起伏）
    const beat = 0.90 + 0.10 * Math.sin(now / 260);
    warnCv.style.opacity = devilOn ? '1' : (planetLevel * beat).toFixed(3);

    if (devilOn) drawLavaCat(now);

    fxCtx.globalCompositeOperation = 'lighter';
    fxCtx.lineCap = 'round';

    // 地平線上一層隨脈搏起伏的熾熱輝光
    const pulse = 0.55 + 0.45 * Math.sin(now / 190);
    const glowA = (0.06 + u * 0.26) * pulse;
    const rG = R * 1.10, limbG = R / rG;
    const gg = fxCtx.createRadialGradient(cx, cy, 0, cx, cy, rG);
    gg.addColorStop(0, 'rgba(255,60,20,0)');
    gg.addColorStop(Math.max(0, limbG - 0.045), 'rgba(255,60,20,0)');
    gg.addColorStop(Math.min(1, limbG + 0.002), 'rgba(255,96,40,' + glowA.toFixed(3) + ')');
    gg.addColorStop(1, 'rgba(255,40,10,0)');
    fxCtx.fillStyle = gg;
    fxCtx.beginPath(); fxCtx.arc(cx, cy, rG, 0, 6.283185); fxCtx.fill();

    // 噴發量隨剩餘時間遞增
    fxU = u;
    const rate = (0.9 + u * 8.5) * dt;
    let n = Math.floor(rate);
    if (Math.random() < rate - n) n++;
    for (let i = 0; i < n && sparks.length < 460; i++) spawnSpark();

    // 火箭抖動：幅度跟著急迫度連續變大（用 JS 直接寫 transform，CSS 動畫沒辦法連續調幅）
    if (rocketInner){
      if (u > 0.001){
        const amp = 0.6 + u * 3.4;
        rocketInner.style.transform =
          'translate(' + ((Math.random()-0.5) * amp).toFixed(2) + 'px,' +
                         ((Math.random()-0.5) * amp).toFixed(2) + 'px) rotate(' +
                         ((Math.random()-0.5) * amp * 1.4).toFixed(2) + 'deg)';
      } else {
        rocketInner.style.transform = '';
      }
    }

    for (let i = sparks.length - 1; i >= 0; i--){
      const s = sparks[i];
      s.vx += s.gx * dt; s.vy += s.gy * dt;
      s.x  += s.vx * dt; s.y  += s.vy * dt;
      s.life -= s.decay * dt;

      if (s.life <= 0 || s.y > H + 40){ sparks.splice(i, 1); continue; }

      const l = s.life;
      const g = (60 + 200 * l * l) | 0;              // 白黃 → 橘 → 暗紅
      const b = (30 * l * l * l) | 0;
      const sz = s.size * (0.45 + l * 0.75);
      const col = '255,' + g + ',' + b;

      if (s.big){                                    // 大顆的先鋪一層餘暉
        fxCtx.fillStyle = 'rgba(' + col + ',' + (l * 0.16).toFixed(3) + ')';
        const hz = sz * 3.2;
        fxCtx.fillRect(s.x - hz * 0.5, s.y - hz * 0.5, hz, hz);
      }

      // 沿速度方向拉一小段拖尾，比單純的點更像噴出來的熔岩
      fxCtx.strokeStyle = 'rgba(' + col + ',' + (l * 0.95).toFixed(3) + ')';
      fxCtx.lineWidth = sz;
      fxCtx.beginPath();
      fxCtx.moveTo(s.x, s.y);
      fxCtx.lineTo(s.x - s.vx * 2.1, s.y - s.vy * 2.1);
      fxCtx.stroke();
    }

    fxRaf = requestAnimationFrame(fxTick);
  }

  function startFx(){
    if (REDUCE_MOTION || fxRaf) return;
    fxLast = performance.now();
    fxRaf = requestAnimationFrame(fxTick);
  }

  function stopFxIfIdle(){
    if (warnOn || devilOn) return;         // 還有人在用這個迴圈就別關
    cancelAnimationFrame(fxRaf);
    fxRaf = 0;
    sparks.length = 0;
    fxU = 0;
    if (geom.W) fxCtx.clearRect(0, 0, geom.W, geom.H);
    warnCv.style.opacity = '0';
    if (rocketInner) rocketInner.style.transform = '';
  }

  function setWarning(on){
    if (on === warnOn) return;
    warnOn = on;
    document.body.classList.toggle('is-warning', on);
    if (on){
      renderAlertLayer();                  // 還沒算好就現在補算（通常閒置時已經算完了）
      startFx();
    } else {
      stopFxIfIdle();
    }
  }

  function startDevil(){
    if (devilOn) return;
    devilOn = true;
    devilT0 = performance.now();
    renderAlertLayer();
    warnCv.style.opacity = '1';

    // 破土而出的那一下，先炸一波熔岩
    fxU = 1;
    for (let i = 0; i < 90 && sparks.length < 460; i++) spawnSpark();

    if (REDUCE_MOTION){
      // 不跑動畫也要看得到結果：直接畫出已經完全升起的樣子
      devilT0 = performance.now() - 1600;
      if (geom.W){
        fxCtx.clearRect(0, 0, geom.W, geom.H);
        drawLavaCat(performance.now());
      }
      document.body.classList.add('is-shouting');
    } else {
      startFx();
      setTimeout(() => {
        if (devilOn) document.body.classList.add('is-shouting');
      }, 700);
    }
  }

  function stopDevil(){
    if (!devilOn) return;
    devilOn = false;
    document.body.classList.remove('is-shouting');
    stopFxIfIdle();
  }

  function render(){
    const s = Math.ceil(remaining / 1000);
    const mm = String(Math.floor(s / 60)).padStart(2, '0');
    const ss = String(s % 60).padStart(2, '0');

    const warn = remaining > 0 && remaining <= WARN_MS;
    urgency = warn ? Math.min(1, 1 - remaining / WARN_MS) : 0;
    // UI 早一點開始升溫（提示性），星球晚一點才整顆燒紅（戲劇性）
    warnLevel   = devilOn ? 1 : Math.pow(urgency, 0.75);
    planetLevel = devilOn ? 1 : Math.pow(urgency, 1.9);
    setWarning(warn);
    applyAccent(warnLevel);
    document.body.classList.toggle('is-critical', remaining > 0 && remaining <= CRITICAL_MS);

    // 靜態偏好下沒有 rAF 迴圈，紅色濃度改在這裡寫
    if (REDUCE_MOTION) warnCv.style.opacity = devilOn ? '1' : planetLevel.toFixed(3);

    if (elMM.textContent !== mm) elMM.textContent = mm;
    if (elSS.textContent !== ss){
      elSS.textContent = ss;
      // 分頁在背景時看不到畫面，警示要靠標題傳達
      document.title = (warn ? '⚠ ' : '') + mm + ':' + ss + ' · 任務計時器';
    }
    elTrack.style.setProperty('--p', (1 - remaining / TOTAL).toFixed(5));
  }

  function setPhase(phase){
    elStatus.textContent = STATE[phase];
    document.body.classList.toggle('is-running', phase === 'running');
    document.body.classList.toggle('is-done', phase === 'done');
  }

  function tick(now){
    if (!running) return;
    remaining = endAt - now;
    if (remaining <= 0){
      remaining = 0;
      running = false;
      startDevil();        // 先起魔物，render() 才知道要維持紅色與特效迴圈
      render();
      setPhase('done');
      return;
    }
    render();
    raf = requestAnimationFrame(tick);
  }

  function launch(){
    if (running) return;
    stopDevil();
    if (remaining <= 0) remaining = TOTAL;      // 完成後再按發射 → 重新出發
    running = true;
    endAt = performance.now() + remaining;
    setPhase('running');
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(tick);
  }

  function hold(){
    if (!running) return;
    running = false;
    remaining = Math.max(0, endAt - performance.now());
    cancelAnimationFrame(raf);
    render();
    setPhase('hold');
  }

  function goHome(){
    running = false;
    cancelAnimationFrame(raf);
    stopDevil();
    remaining = TOTAL;
    render();
    setPhase('idle');
    document.title = '任務計時器 · Mission Timer';
  }

  btnLaunch.addEventListener('click', launch);
  btnHold.addEventListener('click', hold);
  btnReturn.addEventListener('click', goHome);

  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLButtonElement) return;   // 讓按鈕自己處理 Space / Enter
    if (e.key === ' '){ e.preventDefault(); running ? hold() : launch(); }
    else if (e.key === 'r' || e.key === 'R'){ goHome(); }
  });

  // 背景分頁的 rAF 會被節流，切回前景時立刻補算一次
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && running){ cancelAnimationFrame(raf); tick(performance.now()); }
  });

  render();
  setPhase('idle');

  /* ============================================================
     5. 今日台北日出／日落
     取不到就顯示「離線」；這一段全程包在 try/catch 裡，
     不論網路失敗、逾時或回傳格式怪異，都不會影響計時器與背景
     ============================================================ */

  const elSun = document.getElementById('sun');
  const SUN_URL = 'https://api.open-meteo.com/v1/forecast' +
    '?latitude=25.03&longitude=121.56&daily=sunrise,sunset' +
    '&timezone=Asia/Taipei&forecast_days=1';

  // 回傳格式是 "2026-08-09T05:23"，已經是台北當地時間，直接取字串不要再轉時區
  function hhmm(iso){
    const m = /T(\d{2}:\d{2})/.exec(String(iso));
    return m ? m[1] : null;
  }

  function sunOffline(){
    elSun.textContent = '離線';
    elSun.classList.remove('is-ready');
    elSun.classList.add('is-offline');
  }

  async function loadSun(){
    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 8000);   // 卡住不要無限等
    try {
      const res = await fetch(SUN_URL, { signal: ctrl.signal, cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const daily = data && data.daily;
      const rise = hhmm(daily && daily.sunrise && daily.sunrise[0]);
      const set  = hhmm(daily && daily.sunset  && daily.sunset[0]);
      if (!rise || !set) throw new Error('unexpected payload');
      elSun.textContent = '日出 ' + rise + ' ／ 日落 ' + set;
      elSun.classList.remove('is-offline');
      elSun.classList.add('is-ready');
    } catch (err) {
      sunOffline();
    } finally {
      clearTimeout(timeout);
    }
  }

  try { loadSun(); } catch (err) { sunOffline(); }
})();
</script>
</body>
